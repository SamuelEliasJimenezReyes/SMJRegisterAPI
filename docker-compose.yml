version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=SMJRegisterDB;User Id=postgres;Password=example;
      - JwtSettings__Key=your_development_key_here_at_least_32_chars
      - JwtSettings__Issuer=SMJRegisterAPI
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./appsettings.Development.json:/app/appsettings.Development.json:ro

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: SMJRegisterDB
      POSTGRES_PASSWORD: example
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: